<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">French number recognition pipeline</title>
  <desc id="desc">An audio waveform, mel-spectrogram, convolutional neural network, and constrained decoder producing a number between zero and ninety-nine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2940"/><stop offset="1" stop-color="#071c2c"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70c5df"/><stop offset="1" stop-color="#cfe77f"/></linearGradient>
    <linearGradient id="mel" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#12324c"/><stop offset=".35" stop-color="#287a9d"/><stop offset=".7" stop-color="#d5dd70"/><stop offset="1" stop-color="#f5a259"/></linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="50" y="58" fill="#9bb5c6" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">SPEECH PIPELINE · FRENCH 0–99</text>
  <g transform="translate(50 110)">
    <rect width="245" height="190" rx="8" fill="#102f47" stroke="#45677d"/>
    <text x="20" y="31" fill="#d9e6ed" font-family="Arial, sans-serif" font-size="14" font-weight="700">WAVEFORM</text>
    <path d="M18 105 L30 102 42 108 54 88 66 122 78 70 90 137 102 48 114 146 126 78 138 117 150 93 162 107 174 101 186 108 198 89 210 120 226 104" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="170" fill="#7593a6" font-family="Arial, sans-serif" font-size="12">16 kHz · mono audio</text>
  </g>
  <path d="M315 205 H353" stroke="#6a8ca0" stroke-width="3"/><path d="M353 205 l-10 -7 v14z" fill="#6a8ca0"/>
  <g transform="translate(375 110)">
    <rect width="245" height="190" rx="8" fill="#102f47" stroke="#45677d"/>
    <text x="20" y="31" fill="#d9e6ed" font-family="Arial, sans-serif" font-size="14" font-weight="700">MEL-SPECTROGRAM</text>
    <g transform="translate(20 50)">
      <rect width="205" height="88" rx="3" fill="#081c2b"/>
      <rect x="12" width="18" height="88" fill="url(#mel)" opacity=".35"/><rect x="34" width="9" height="88" fill="url(#mel)" opacity=".65"/><rect x="48" width="22" height="88" fill="url(#mel)" opacity=".42"/><rect x="75" width="13" height="88" fill="url(#mel)" opacity=".9"/><rect x="93" width="30" height="88" fill="url(#mel)" opacity=".48"/><rect x="128" width="15" height="88" fill="url(#mel)" opacity=".78"/><rect x="148" width="34" height="88" fill="url(#mel)" opacity=".38"/><rect x="187" width="10" height="88" fill="url(#mel)" opacity=".85"/>
      <path d="M0 22H205M0 44H205M0 66H205" stroke="#d7e787" opacity=".16"/>
    </g>
    <text x="20" y="170" fill="#7593a6" font-family="Arial, sans-serif" font-size="12">64 frequency bins</text>
  </g>
  <path d="M640 205 H678" stroke="#6a8ca0" stroke-width="3"/><path d="M678 205 l-10 -7 v14z" fill="#6a8ca0"/>
  <g transform="translate(700 110)">
    <rect width="210" height="190" rx="8" fill="#102f47" stroke="#45677d"/>
    <text x="20" y="31" fill="#d9e6ed" font-family="Arial, sans-serif" font-size="14" font-weight="700">CNN + DECODER</text>
    <g transform="translate(22 55)" fill="none" stroke="#70c5df">
      <rect width="32" height="65"/><rect x="42" y="8" width="32" height="49"/><rect x="84" y="15" width="32" height="35"/><rect x="126" y="21" width="32" height="23"/>
    </g>
    <text x="20" y="170" fill="#7593a6" font-family="Arial, sans-serif" font-size="12">23 reusable components</text>
  </g>
  <g transform="translate(50 355)">
    <rect width="860" height="120" rx="8" fill="#f0f2ed"/>
    <text x="24" y="37" fill="#486173" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CONSTRAINED LINGUISTIC OUTPUT</text>
    <text x="24" y="88" fill="#0d2940" font-family="Georgia, serif" font-size="39">“quatre-vingt-dix-sept”</text>
    <path d="M565 67 H655" stroke="#7a91a0" stroke-width="3"/><path d="M655 67 l-10 -7 v14z" fill="#7a91a0"/>
    <rect x="690" y="25" width="135" height="72" rx="6" fill="#0d2940"/>
    <text x="757.5" y="75" text-anchor="middle" fill="#d9ed91" font-family="Arial, sans-serif" font-size="38" font-weight="700">97</text>
  </g>
</svg>
